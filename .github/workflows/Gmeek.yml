name: build Gmeek

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'backup/**'
      - 'blogBase.json'
      - 'README.md'
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled, pinned, unpinned]
  schedule:
    - cron: "0 16 * * *"

concurrency:
  group: build-gmeek
  cancel-in-progress: false

jobs:
  build:
    name: Generate blog
    runs-on: ubuntu-24.04
    if: ${{ github.event.repository.owner.id == github.event.sender.id || github.event_name == 'schedule' || github.event_name == 'push' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Clone source code
        run: |
          BRANCH=$(jq -r '.GMEEK_VERSION' config.json)
          git clone --depth 1 --branch "$BRANCH" https://github.com/tiengming/Gmeek.git /opt/Gmeek
          # pip 缓存只在工作区内匹配哈希文件，复制一份进来
          cp /opt/Gmeek/requirements.txt ./gmeek-requirements.txt

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: gmeek-requirements.txt

      - name: Install dependencies
        run: pip install -r /opt/Gmeek/requirements.txt

      - name: Generate new html
        run: |
          cp -r ./* /opt/Gmeek/
          cd /opt/Gmeek/
          python Gmeek.py ${{ secrets.GITHUB_TOKEN }} ${{ github.repository }} --issue_number '${{ github.event.issue.number }}'
          cp -a /opt/Gmeek/docs ${{ github.workspace }}
          cp -a /opt/Gmeek/backup ${{ github.workspace }}
          cp /opt/Gmeek/blogBase.json ${{ github.workspace }}

      - name: update html
        run: |
          rm -f gmeek-requirements.txt
          git config --local user.email "$(jq -r ".email" config.json)"
          git config --local user.name "${{ github.repository_owner }}"
          git add .
          git commit -a -m '🎉auto update by Gmeek action' || echo "nothing to commit"
          git push || echo "nothing to push"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs/.'

  deploy:
    name: Deploy blog
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
      actions: read        # deploy-pages v4+ 要求
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
