name: build blog

# 管线：issue 增删改 / push / 手动 / 每日定时 → 同步 issues → 构建静态站 → 部署 Pages
# 模板使用者：改 site.ts 与 workflow 无需再动（aboutLabel 默认 about，与 site.ts 联动）

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, pinned, unpinned]
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "DESIGN.md"
      - "docs/**"
      - "legacy/**"
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *" # 每日 00:00 (UTC+8) 重建

concurrency:
  group: blog-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Sync & Build
    runs-on: ubuntu-latest
    # issue 事件仅响应仓库所有者，避免他人开 issue 触发部署
    if: ${{ github.event_name != 'issues' || github.event.repository.owner.id == github.event.sender.id }}
    permissions:
      contents: write # 同步结果提交回仓库
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Sync issues to content
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-issues.mjs --repo "${{ github.repository }}" --token "$GH_TOKEN"

      - name: Commit synced content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          git commit -m "chore(sync): mirror issues to content [skip ci]" || echo "no changes"
          git push || echo "nothing to push"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
