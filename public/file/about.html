<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我 - Tiengming</title>
    <meta name="description" content="热爱玄学、编程和人工智能的全栈开发者">
    <script>
    (function(){try{var t=localStorage.getItem("meek_theme");
    if(t==="dark"||t==="auto"||t==="light"){document.documentElement.setAttribute("data-color-mode",t);}}catch(e){}})();
    </script>
    <link rel="icon" href="/favicon.svg">
    <link rel="stylesheet" href="/assets/aurora/tokens.css">
    <link rel="stylesheet" href="/assets/aurora/theme.css">
    <style>
    body {
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
    }
    .about-header {
        position: sticky;
        top: 0;
        z-index: var(--z-header);
        background: color-mix(in srgb, var(--bg-base) 55%, transparent);
        -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
        backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
        border-bottom: 1px solid var(--border);
    }
    .about-header-inner {
        max-width: 860px;
        margin: 0 auto;
        padding: 0 var(--space-gutter);
        height: var(--header-h);
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .about-main {
        width: 100%;
        max-width: 860px;
        margin: 0 auto;
        padding: clamp(32px, 6vw, 56px) var(--space-gutter) 80px;
        flex: 1;
    }
    .about-hero {
        text-align: center;
        padding: clamp(28px, 6vw, 52px) clamp(20px, 4vw, 44px);
        border-radius: var(--r-xl);
        margin-bottom: 26px;
    }
    .about-avatar {
        width: 112px;
        height: 112px;
        border-radius: var(--r-full);
        padding: 4px;
        margin: 0 auto 18px;
        background: conic-gradient(from 140deg, var(--au-blue), var(--au-violet), var(--au-pink), var(--au-teal), var(--au-blue));
        animation: rise-in var(--t-slow) var(--ease-out) both;
    }
    .about-avatar img {
        width: 100%;
        height: 100%;
        border-radius: var(--r-full);
        display: block;
        object-fit: cover;
        background: var(--bg-base);
        transition: transform var(--t-base) var(--ease-spring);
    }
    .about-avatar:hover img {
        transform: scale(1.06) rotate(6deg);
    }
    .about-hero h1 {
        margin: 0 0 10px;
        font-size: clamp(1.6rem, 4vw, 2.1rem);
        font-weight: 800;
        background: linear-gradient(120deg, var(--text-1) 30%, var(--accent) 70%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: rise-in var(--t-slow) var(--ease-out) 0.06s both;
    }
    .about-hero p {
        margin: 0 auto;
        max-width: 36em;
        color: var(--text-2);
        line-height: 1.9;
        animation: rise-in var(--t-slow) var(--ease-out) 0.12s both;
    }
    .about-section {
        margin-bottom: 26px;
    }
    .about-section > h2 {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 18px;
        font-size: 1.25rem;
        font-weight: 700;
    }
    .about-section > h2::before {
        content: "";
        width: 16px;
        height: 2.5px;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--au-blue), var(--au-pink));
    }
    .skill-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 16px;
    }
    .skill-card {
        border-radius: var(--r-lg);
        padding: 24px 18px;
        text-align: center;
        transition: transform var(--t-base) var(--ease-out), box-shadow var(--t-base);
    }
    .skill-card:hover {
        transform: translateY(-5px);
        box-shadow: var(--shadow-3), var(--glow-shadow);
    }
    .skill-emoji {
        font-size: 2.1rem;
        line-height: 1;
        margin-bottom: 12px;
        display: inline-block;
        filter: drop-shadow(0 6px 14px var(--glow-blue));
    }
    .skill-card h3 {
        margin: 0 0 6px;
        font-size: 1.02rem;
        font-weight: 700;
    }
    .skill-card p {
        margin: 0;
        font-size: var(--fs-sm);
        color: var(--text-2);
        line-height: 1.7;
    }
    .interest-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 16px;
    }
    .interest-card {
        border-radius: var(--r-lg);
        padding: 22px 14px;
        text-align: center;
        transition: transform var(--t-base) var(--ease-out), box-shadow var(--t-base);
    }
    .interest-card:hover {
        transform: translateY(-5px);
        box-shadow: var(--shadow-3);
    }
    .interest-ring {
        --pct: 0;
        width: 86px;
        height: 86px;
        margin: 0 auto 12px;
        border-radius: var(--r-full);
        background: conic-gradient(var(--accent) calc(var(--pct) * 1%), color-mix(in srgb, var(--text-3) 22%, transparent) 0);
        display: grid;
        place-items: center;
        transition: transform var(--t-base) var(--ease-spring);
    }
    .interest-card:hover .interest-ring {
        transform: scale(1.07) rotate(4deg);
    }
    .interest-ring::before {
        content: "";
        position: absolute;
        width: 68px;
        height: 68px;
        border-radius: var(--r-full);
        background: var(--surface-strong);
    }
    .interest-ring {
        position: relative;
    }
    .interest-ring span {
        position: relative;
        font-size: 1.6rem;
    }
    .interest-card p {
        margin: 0;
        color: var(--text-2);
        font-size: var(--fs-sm);
        font-weight: 500;
    }
    .about-footer-link {
        text-align: center;
        margin-top: 8px;
    }
    .btn-aurora {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 26px;
        border-radius: var(--r-full);
        border: none;
        color: #fff;
        font-size: var(--fs-md);
        font-weight: 600;
        cursor: pointer;
        background: linear-gradient(120deg, var(--accent-strong), color-mix(in srgb, var(--au-violet) 85%, var(--accent-strong)));
        box-shadow: var(--shadow-2), 0 12px 32px -10px var(--glow-blue);
        transition: transform var(--t-fast) var(--ease-spring), box-shadow var(--t-base);
    }
    .btn-aurora:hover {
        transform: translateY(-3px);
        box-shadow: var(--shadow-3), 0 18px 44px -12px var(--glow-blue);
        color: #fff;
    }
    .btn-aurora:active {
        transform: scale(0.97);
    }
    @media (prefers-reduced-motion: reduce) {
        .about-avatar, .about-hero h1, .about-hero p {
            animation: none;
        }
    }
    </style>
</head>
<body data-page="single">

    <header class="about-header">

                    <svg class="i-sun" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5zM8 12a4 4 0 100-8 4 4 0 000 8zM8 0a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0V.75A.75.75 0 018 0zm0 13a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0v-1.5A.75.75 0 018 13zM2.343 2.343a.75.75 0 011.061 0l1.06 1.061a.75.75 0 01-1.06 1.06l-1.06-1.06a.75.75 0 010-1.06zm9.193 9.193a.75.75 0 011.06 0l1.061 1.06a.75.75 0 01-1.06 1.061l-1.061-1.06a.75.75 0 010-1.061zM16 8a.75.75 0 01-.75.75h-1.5a.75.75 0 010-1.5h1.5A.75.75 0 0116 8zM3 8a.75.75 0 01-.75.75H.75a.75.75 0 010-1.5h1.5A.75.75 0 013 8zm10.657-5.657a.75.75 0 010 1.061l-1.061 1.06a.75.75 0 11-1.06-1.06l1.06-1.06a.75.75 0 011.06 0zm-9.193 9.193a.75.75 0 010 1.06l-1.06 1.061a.75.75 0 11-1.061-1.06l1.06-1.061a.75.75 0 011.061 0z"></path></svg>
                    <svg class="i-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.598 1.591a.75.75 0 01.785-.175 7 7 0 11-8.967 8.967.75.75 0 01.961-.96 5.5 5.5 0 007.046-7.046.75.75 0 01.175-.786zm1.616 1.945a7 7 0 01-7.678 7.678 5.5 5.5 0 107.678-7.678z"></path></svg>
                    <svg class="i-sync" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.705 8.005a.75.75 0 0 1 .834.656 5.5 5.5 0 0 0 9.592 2.97l-1.204-1.204a.25.25 0 0 1 .177-.427h3.646a.25.25 0 0 1 .25.25v3.646a.25.25 0 0 1-.427.177l-1.38-1.38A7.002 7.002 0 0 1 1.05 8.84a.75.75 0 0 1 .656-.834ZM8 2.5a5.487 5.487 0 0 0-4.131 1.869l1.204 1.204A.25.25 0 0 1 4.896 6H1.25A.25.25 0 0 1 1 5.75V2.104a.25.25 0 0 1 .427-.177l1.38 1.38A7.002 7.002 0 0 1 14.95 7.16a.75.75 0 0 1-1.49.178A5.5 5.5 0 0 0 8 2.5Z"></path></svg>
                </button>
            </nav>
        </div>
    </header>

    <main class="about-main">
        <section class="about-hero glass">
            <div class="about-avatar"><img src="/favicon.svg" alt="Tiengming"></div>
            <h1>关于我</h1>
            <p>热爱玄学、编程和人工智能的未来进行时全栈开发者，致力于创造有价值的产品。我擅长解决复杂问题，并且热衷于学习新技术。在工作中，我注重团队协作，善于沟通，并且乐于分享知识。</p>
        </section>

        <section class="about-section" id="skills">
            <h2>专业技能</h2>
            <div class="skill-grid">
                <div class="skill-card glass">
                    <span class="skill-emoji">⛰️</span>
                    <h3>地质工程</h3>
                    <p>专业的地质工程知识和实践经验</p>

                    <span class="skill-emoji">☯️</span>
                    <h3>出道仙</h3>
                    <p>深入研究修炼之道</p>
                </div>
                <div class="skill-card glass">
                    <span class="skill-emoji">🤖</span>
                    <h3>人工智能</h3>
                    <p>AI 大模型的运用</p>
                </div>
                <div class="skill-card glass">
                    <span class="skill-emoji">💻</span>
                    <h3>编程</h3>
                    <p>精通基于 AI 的多种编程语言</p>
                </div>
            </div>
        </section>

        <section class="about-section" id="interests">
            <h2>兴趣爱好</h2>
            <div class="interest-grid">
                <div class="interest-card glass">
                    <div class="interest-ring" style="--pct:80"><span>📚</span></div>
                    <p>阅读</p>
                </div>
                <div class="interest-card glass">
                    <div class="interest-ring" style="--pct:70"><span>🚶</span></div>

                </div>
            </div>

        <div class="about-footer-link">
            <a class="btn-aurora" href="https://nav.buxiantang.top" target="_blank" rel="noopener">🧭 网址导航</a>

    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <div>Copyright © <span id="year"></span> <a href="/">Tiengming</a></div>
        </div>
    </footer>

    <script>
    function modeSwitch(){
        var el=document.documentElement;
        var cur=el.getAttribute("data-color-mode");
        var next=cur==="light"?"dark":cur==="dark"?"auto":"light";
        try{localStorage.setItem("meek_theme",next);}catch(e){}
        el.setAttribute("data-color-mode",next);
    }
    document.getElementById("year").textContent=new Date().getFullYear();
    </script>
</body>
</html>
