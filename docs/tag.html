</script></footer><script>
    function modeSwitch(){
        var el=document.documentElement;
        var cur=el.getAttribute("data-color-mode");
        var next=cur==="light"?"dark":cur==="dark"?"auto":"light";
        try{localStorage.setItem("meek_theme",next);}catch(e){}
        el.setAttribute("data-color-mode",next);
        var m=document.querySelector('meta[name="theme-color"]');
        if(m){m.setAttribute("content",next==="dark"?"#0b0e1a":"#f3f4fa");}
    }
    </script>
<script>
(function () {
    "use strict";
    var ICON_POST = "M0 3.75C0 2.784.784 2 1.75 2h12.5c.966 0 1.75.784 1.75 1.75v8.5A1.75 1.75 0 0 1 14.25 14H1.75A1.75 1.75 0 0 1 0 12.25Zm1.75-.25a.25.25 0 0 0-.25.25v8.5c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25v-8.5a.25.25 0 0 0-.25-.25ZM3.5 6.25a.75.75 0 0 1 .75-.75h7a.75.75 0 0 1 0 1.5h-7a.75.75 0 0 1-.75-.75Zm.75 2.25h4a.75.75 0 0 1 0 1.5h-4a.75.75 0 0 1 0-1.5Z";
    var cloud = document.getElementById("tag-cloud");
    var list = document.getElementById("tag-list");
    var input = document.getElementById("tag-search");
    var empty = document.getElementById("tag-empty");
    var summary = document.getElementById("tag-summary");
    var posts = [];
    var labelColors = {};
    var activeLabel = "All";

    function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
    }

    function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
    }

    function buildCloud(counts) {
        var names = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; });
        names.forEach(function (name) {
            var chip = el("button", "tag-chip" + (name === activeLabel ? " active" : ""));
            chip.type = "button";
            chip.style.setProperty("--c", labelColors[name] || "#6d8dff");
            chip.appendChild(document.createTextNode(name === "All" ? "全部" : name));
            chip.appendChild(el("span", "tag-count", String(counts[name])));
            chip.addEventListener("click", function () {
                input.value = "";
                location.hash = name === "All" ? "" : "#" + encodeURIComponent(name);
                applyFilter(name, "");
            });
            cloud.appendChild(chip);
        });
    }

    function buildCard(p) {
        var a = el("a", "post-card glass");
        a.href = "/" + p.postUrl;
        var icon = el("span", "post-card-icon");
        icon.setAttribute("aria-hidden", "true");
        icon.innerHTML = '<svg viewBox="0 0 16 16"><path d="' + ICON_POST + '"></path></svg>';
        a.appendChild(icon);
        var title = el("h2", "post-card-title", p.postTitle);
        a.appendChild(title);
        var labels = el("div", "post-card-labels");
        (p.labels || []).forEach(function (lb) {
            var c = el("span", "chip chip-label", lb);
            c.style.setProperty("--c", labelColors[lb] || "#6d8dff");
            labels.appendChild(c);
        });
        a.appendChild(labels);
        var meta = el("div", "post-card-meta");
        meta.appendChild(el("span", "post-card-date", "🗓 " + (p.createdDate || "")));
        var spacer = el("span", "spacer");
        meta.appendChild(spacer);
        a.appendChild(meta);
        a.classList.add("in");
        return a;
    }

    function applyFilter(label, query) {
        activeLabel = label;
        var q = query.trim().toLowerCase();
        var shown = 0;
        list.textContent = "";
        posts.forEach(function (p) {
            var hitLabel = label === "All" || (p.labels || []).indexOf(label) !== -1;
            var hitQuery = !q || String(p.postTitle).toLowerCase().indexOf(q) !== -1;
            if (hitLabel && hitQuery) {
                list.appendChild(buildCard(p));
                shown++;
            }
        });
        empty.style.display = shown ? "none" : "block";
        summary.textContent = label === "All"
            ? "共 " + posts.length + " 篇文章"
            : "标签「" + label + "」下 " + shown + " 篇文章";
        Array.prototype.forEach.call(cloud.children, function (c) {
            var name = c.childNodes[0].nodeValue === "全部" ? "All" : c.childNodes[0].nodeValue;
            c.classList.toggle("active", name === label);
        });
    }

    input.addEventListener("input", function () {
        if (input.value && activeLabel !== "All") {
            activeLabel = "All";
        }
        if (input.value) { location.hash = ""; }
        applyFilter("All", input.value);
    });
    input.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
            input.value = "";
            location.hash = "";
            applyFilter("All", "");
        }
    });
    window.addEventListener("hashchange", function () {
        var h = decodeURIComponent(location.hash.slice(1));
        if (!h) { applyFilter("All", input.value); return; }
        if (labelColors[h] || h === "All") {
            input.value = "";
            applyFilter(h, "");
        } else {
            input.value = h;
            applyFilter("All", h);
        }
    });

    fetch("/postList.json", { credentials: "same-origin" })
        .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
        })
        .then(function (data) {
            labelColors = data.labelColorDict || {};
            var counts = { All: 0 };
            Object.keys(data).forEach(function (k) {
                if (k === "labelColorDict") return;
                var p = data[k];
                if (!p || !p.postTitle) return;
                posts.push(p);
                counts.All++;
                (p.labels || []).forEach(function (lb) {
                    counts[lb] = (counts[lb] || 0) + 1;
                });
            });
            posts.sort(function (a, b) {
                return String(b.createdDate || "").localeCompare(String(a.createdDate || ""));
            });
            buildCloud(counts);
            var h = decodeURIComponent(location.hash.slice(1));
            if (h && (labelColors[h])) { applyFilter(h, ""); }
            else if (h) { input.value = h; applyFilter("All", h); }
            else { applyFilter("All", ""); }
        })
        .catch(function () {
            summary.textContent = "加载失败，请刷新重试";
            summary.style.color = "#d43c55";
        });
})();
</script>
